name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: paperly-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 release APK
    runs-on: ubuntu-latest
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build installable release APK
        run: gradle --no-daemon -p android :app:assembleRelease

      - name: Show APK size
        run: |
          find android/app/build/outputs/apk -type f -name '*.apk' -print -exec du -h {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperly-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
