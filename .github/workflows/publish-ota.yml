name: Publish Paperly OTA update

on:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "index.js"
      - "src/**"
      - "assets/**"
  workflow_dispatch:
    inputs:
      message:
        description: Update description
        required: false
        default: "Paperly update from main"

permissions:
  contents: read

concurrency:
  group: paperly-ota-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish compatible Android JavaScript update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      OTA_MESSAGE: ${{ inputs.message || '' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Check OTA credentials
        id: ota
        shell: bash
        run: |
          UUID_REGEX="^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          if [[ ! "$EAS_PROJECT_ID" =~ $UUID_REGEX || ${#EXPO_TOKEN} -lt 20 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## OTA publish skipped"
              echo "Set EAS_PROJECT_ID to a valid EAS project UUID and EXPO_TOKEN to a valid Expo access token in repository Actions settings."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.ota.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.ota.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Publish production OTA update
        if: steps.ota.outputs.ready == 'true'
        shell: bash
        run: |
          MESSAGE="${OTA_MESSAGE:-Paperly main ${GITHUB_SHA:0:8}}"
          npx --yes eas-cli@latest update \
            --branch production \
            --platform android \
            --message "$MESSAGE" \
            --non-interactive

      - name: Explain skipped publish
        if: steps.ota.outputs.ready != 'true'
        run: echo "OTA publishing is not connected yet. Android APK builds continue to work normally."
